<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06121c">
<title>Glass Control</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside id="side"><nav class="side-in glass" id="nav" aria-label="Menu"></nav></aside>
  <div id="main">
    <header id="top">
      <button class="icon-btn menu-btn" data-act="drawer" aria-label="Menu"></button>
      <form class="search" id="searchf" role="search" autocomplete="off"><span id="search-ic"></span><input id="q" type="search" enterkeyhint="search" spellcheck="false"><kbd>/</kbd></form>
      <button class="icon-btn" id="tgt" data-act="target" aria-label="Output"></button><div id="scan"></div><div class="conn" id="conn"><i></i><span id="conn-t"></span></div>
    </header>
    <div id="offline"></div>
    <main id="view"></main>
  </div>
</div>
<div id="mini" class="glass"></div>
<nav id="tabbar" class="glass"></nav>
<div id="scrim" data-act="drawer"></div>
<div id="toasts"></div>
<button id="totop" class="icon-btn" aria-label="Top" style="display:none;position:fixed;right:18px;bottom:90px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4)">↑</button>
<div id="layer"></div>
<noscript>JavaScript required.</noscript>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/backend.js"></script>
<script src="js/app.js"></script>
<script src="js/player.js"></script>
<script src="js/lib.js"></script>
<script src="js/files.js"></script>
<script src="js/manage.js"></script>
<script src="js/local.js"></script>
<script src="js/en.js"></script>
<script>K.start();</script>
</body>
</html>
